# Private Agent Teams profile layer. Apply after dsh-base so these replacements
# remove the global continuable-child controls before the scoped Team tools
# register the overlapping list_agents, send_message, and interrupt_agent names.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
        freshProvider: spawn
        forkProvider: fork

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

    # Turns the task board's advisory write scopes into refusals on the fs tool
    # path: a scope an in-progress task claims is its owner's while it runs.
    - id: agent-team-write-lease
      name: '@deepseek-ai/dsh-experimental-agent-team-write-lease'
